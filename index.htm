<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <title>GəlinMaşınım.az - Nerv Komandası</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <nav>
        <a href="#" class="logo">GəlinMaşınım<span>.az</span></a>
        <button class="btn-add">Elan Yerləşdir</button>
    </nav>


    <div class="hero">
        <h1>Ən Gözəl Gününüz Üçün Mükəmməl Maşın</h1>
        <div class="search-bar">
            <input type="text" placeholder="Model və ya rəng...">
            <button>Axtar</button>
        </div>
    </div>

    <div class="car-container">

        <div class="car-card">
            <div class="car-img retro-img"></div>
            <h3>GAZ-13 Chaika</h3>
            <p class="price">150 AZN / gün</p>
            <button class="btn-rent">Bron et</button>
        </div>
        <a href="rolls-royce.html" style="text-decoration: none; color: black;">
            <div class="car-card">
                <div class="car-img luxury-img"></div>
                <h3>Rolls-Royce Ghost</h3>
                <p class="price">999 AZN / gün</p>
                <button class="btn-rent">Bron et</button>
            </div>
        </a>



        <div class="car-card">
            <div class="car-img cabrio-img"></div>
            <h3>Porsche 911</h3>
            <p class="price">300 AZN / gün</p>
            <button class="btn-rent">Bron et</button>
        </div>
        <div class="car-card">
            <div class="car-img mercedes-img"></div>
            <h3>Mercedes S-Class</h3>
            <p class="price">200 AZN / gün</p>
            <button class="btn-rent">Bron et</button>
        </div>

        <div class="car-card">
            <div class="car-img limo-img"></div>
            <h3>Lincoln Limousine</h3>
            <p class="price">250 AZN / gün</p>
            <button class="btn-rent">Bron et</button>
        </div>

        <div class="car-card">
            <div class="car-img gclass-img"></div>
            <h3>Mercedes G-Class (Galenvagen)</h3>
            <p class="price">400 AZN / gün</p>
            <button class="btn-rent">Bron et</button>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Nerv Komandası</p>
    </footer>

</body>

</html>
